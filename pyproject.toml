[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mediavault-cli"
version = "0.1.0"
description = "Scan, catalogue, and analyze a local movie/TV library."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["typer", "rich", "questionary"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
mediavault-cli = "mediavault.cli.main:app"

[tool.setuptools.packages.find]
include = ["mediavault*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
